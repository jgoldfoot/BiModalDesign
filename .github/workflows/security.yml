name: Security

on:
  pull_request:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  npm-audit-root:
    name: npm audit (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit
        # Audit production dependencies at moderate+. Dev-only tooling vulns
        # (e.g., the js-yaml quadratic-DoS advisory pulled in via
        # @istanbuljs/load-nyc-config for jest coverage) are not shipped to
        # users and cannot be resolved without breaking jest, so they are
        # excluded here; Trivy and Dependabot still track the full tree.
        run: npm audit --omit=dev --audit-level=moderate

  trivy-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
