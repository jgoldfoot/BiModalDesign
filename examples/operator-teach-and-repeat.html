<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teach & Repeat Demonstration Learning</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 2rem; }
        .step { border: 1px solid #ccc; padding: 1.5rem; margin-bottom: 1.5rem; border-radius: 4px; }
        .step h2 { margin-top: 0; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input[type="text"], input[type="email"], select { width: 100%; padding: 0.5rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 0.5rem 1rem; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0055aa; }
        .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    </style>
</head>
<body>
    <main role="main" aria-label="Demonstration Learning Workflow">
        <h1>Account Provisioning Workflow</h1>
        <p>This form is optimized for "Teach & Repeat" agents (like Project Mariner) by using stable IDs, explicit labels, semantic groupings, and native web standards.</p>

        <form id="provisioning-workflow" action="/submit" method="post" aria-labelledby="workflow-title">
            <h2 id="workflow-title" class="visually-hidden">New User Provisioning</h2>

            <fieldset class="step" aria-labelledby="step1-title">
                <legend id="step1-title">Step 1: User Details</legend>

                <label for="user-full-name">Full Name</label>
                <input type="text" id="user-full-name" name="fullName" required aria-required="true" autocomplete="name">

                <label for="user-email-address">Email Address</label>
                <input type="email" id="user-email-address" name="email" required aria-required="true" autocomplete="email">
            </fieldset>

            <fieldset class="step" aria-labelledby="step2-title">
                <legend id="step2-title">Step 2: Role Assignment</legend>

                <label for="user-system-role">System Role</label>
                <select id="user-system-role" name="role" required aria-required="true">
                    <option value="" disabled selected>Select a role...</option>
                    <option value="viewer">Viewer</option>
                    <option value="editor">Editor</option>
                    <option value="admin">Administrator</option>
                </select>

                <label for="user-department">Department</label>
                <input type="text" id="user-department" name="department" required aria-required="true">
            </fieldset>

            <div class="step">
                <h2>Step 3: Confirmation</h2>
                <button type="submit" id="submit-provisioning-workflow" aria-label="Create User Account">Create User Account</button>
            </div>
        </form>
    </main>
</body>
</html>
